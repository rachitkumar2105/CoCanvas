version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/core-api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/sync-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/core-api"
      - "/sync-service"
      - "/frontend"
    schedule:
      interval: "weekly"
