name: core-api CI

on:
  push:
    branches: [main]
    paths:
      - "core-api/**"
      - ".github/workflows/core-api-ci.yml"
  pull_request:
    paths:
      - "core-api/**"
      - ".github/workflows/core-api-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
