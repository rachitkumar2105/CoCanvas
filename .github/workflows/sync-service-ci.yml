name: sync-service CI

on:
  push:
    branches: [main]
    paths:
      - "sync-service/**"
      - ".github/workflows/sync-service-ci.yml"
  pull_request:
    paths:
      - "sync-service/**"
      - ".github/workflows/sync-service-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sync-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test
