spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cocanvas}
    username: ${DB_USERNAME:cocanvas}
    password: ${DB_PASSWORD:cocanvas}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: core-api

cocanvas:
  jwt:
    # HMAC-SHA256 signing secret shared with the sync service. Must be >= 32 bytes.
    secret: ${JWT_SECRET:dev-only-secret-please-override-in-every-real-environment-32b}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
    collab-token-ttl-seconds: ${JWT_COLLAB_TTL:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  internal:
    # Shared secret the sync service presents on /internal/** calls (snapshot read/write),
    # and the same secret the Core API presents back when it calls the sync service (e.g.
    # to push a restored version into a live session). This is service-to-service trust
    # in both directions — not a user credential, not the JWT signing secret.
    sync-service-secret: ${INTERNAL_SYNC_SECRET:dev-only-internal-secret-override-in-every-real-environment}
  sync-service:
    internal-url: ${SYNC_SERVICE_INTERNAL_URL:http://localhost:4000}
  rate-limit:
    # Section 3 Tier 2: rate limiting on auth and document-creation endpoints.
    register-max-requests: ${RATE_LIMIT_REGISTER_MAX:5}
    register-window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:60}
    login-max-requests: ${RATE_LIMIT_LOGIN_MAX:10}
    login-window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
    document-create-max-requests: ${RATE_LIMIT_DOC_CREATE_MAX:30}
    document-create-window-seconds: ${RATE_LIMIT_DOC_CREATE_WINDOW_SECONDS:60}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
